kind = "web"
previewPath = "/"
title = "Aniket Portfolio"
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "npm --prefix /home/runner/workspace/frontend run dev"

[services.production]
build = [ "npm", "--prefix", "/home/runner/workspace/frontend", "run", "build" ]
serve = "static"
publicDir = "frontend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
